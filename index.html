<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Life Planner</title>
<style>
:root{
  --sx-white:#FFFFFF; --sx-midnight:#040C17; --sx-blue:#1383F4; --sx-blue-dark:#0D1775;
  --sx-green:#078A04; --sx-green-dark:#014C0C;
  --sx-gradient-blue:linear-gradient(135deg,#1383F4 0%,#0D1775 100%);
  --sx-gradient-green:linear-gradient(135deg,#078A04 0%,#014C0C 100%);
  --sx-sat-50:#F3F8FE; --sx-sat-100:#DFE6EF; --sx-sat-200:#C9D2DF; --sx-sat-300:#B3C0D3;
  --sx-sat-400:#9FB0C7; --sx-sat-500:#7B90AE; --sx-sat-600:#5C7495; --sx-sat-700:#425A7C;
  --sx-sat-800:#2B4362; --sx-sat-900:#1A2E49; --sx-sat-1000:#0D1C30;
  --sx-mid-1000:#121F30;
  --sx-red-500:#EB0000; --sx-red-100:#FBCCCC;
  --sx-orange-500:#F29E1A;
  --sx-fgreen-500:#078A04; --sx-fgreen-100:#CDE8CD;
  --sx-font-display:"forma-djr-display","forma-djr-text",Arial,Helvetica,sans-serif;
  --sx-font:"forma-djr-text","forma-djr-display",Arial,Helvetica,sans-serif;
  --s1:2px;--s2:4px;--s3:8px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --header-h:73px;
  /* light semantic */
  --sx-bg:#F3F8FE; --sx-surface:#FFFFFF; --sx-border:rgba(4,12,23,0.10);
  --sx-text:#040C17; --sx-text-muted:#425A7C; --sx-accent:#1383F4;
  --sx-input-bg:#FFFFFF; --sx-input-border:rgba(4,12,23,0.14);
  --sx-row-alt:#F7FAFF; --sx-thead:#1A2E49;
}
[data-theme="dark"]{
  --sx-bg:#040C17; --sx-surface:#121F30; --sx-border:rgba(255,255,255,0.14);
  --sx-text:#FFFFFF; --sx-text-muted:#B3C0D3; --sx-accent:#1383F4;
  --sx-input-bg:#0D1C30; --sx-input-border:rgba(255,255,255,0.18);
  --sx-row-alt:#0D1C30; --sx-thead:#0D1C30;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sx-font);color:var(--sx-text);background:var(--sx-bg);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--sx-font-display);font-weight:700;letter-spacing:-0.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex:0 0 248px;background:var(--sx-midnight);color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{min-height:var(--header-h);display:flex;align-items:center;padding:0 var(--s5);border-bottom:1px solid rgba(255,255,255,0.08)}
.brandmark{display:flex;align-items:center;gap:10px}
.logo-ico{flex:0 0 36px}
.logo-ico svg{width:36px;height:36px;display:block}
.logo-word{font-family:var(--sx-font-display);font-weight:700;font-size:20px;color:#fff;letter-spacing:-0.01em}
.nav{padding:var(--s4) var(--s3);flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  background:transparent;border:0;color:var(--sx-sat-300);padding:11px 14px;border-radius:8px;
  font-size:14px;font-weight:500;border-left:3px solid transparent;margin-bottom:2px;transition:.12s}
.nav button:hover{background:rgba(255,255,255,0.06);color:#fff}
.nav button.active{background:rgba(19,131,244,0.16);color:#fff;border-left-color:var(--sx-blue);font-weight:600}
.nav .ico{width:18px;height:18px;flex:0 0 18px;opacity:.9}
.side-foot{padding:var(--s4);border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:var(--sx-sat-500)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--sx-surface);min-height:var(--header-h);
  border-bottom:1px solid var(--sx-border);padding:var(--s3) var(--s6);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.topbar h1{font-size:20px}
.topbar .crumb{font-size:12px;color:var(--sx-text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.tools{display:flex;gap:var(--s3);flex-wrap:wrap}
.content{padding:var(--s6);max-width:1180px;width:100%;margin:0 auto}
.view{display:none}.view.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* buttons */
.btn{border:1px solid var(--sx-input-border);background:var(--sx-surface);color:var(--sx-text);
  padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;transition:.12s;
  display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--sx-blue);color:var(--sx-blue)}
.btn.primary{background:var(--sx-blue);border-color:var(--sx-blue);color:#fff}
.btn.primary:hover{background:#0d6fd6;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sx-text-muted)}
.btn.ghost:hover{color:var(--sx-blue);background:rgba(19,131,244,0.08)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:disabled:hover{color:var(--sx-text);background:transparent;border-color:var(--sx-input-border)}
.btn.danger:hover{border-color:var(--sx-red-500);color:var(--sx-red-500)}
.btn.sm{padding:5px 10px;font-size:12px}

/* cards */
.card{background:var(--sx-surface);border:1px solid var(--sx-border);border-radius:14px;
  padding:var(--s5);margin-bottom:var(--s5)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4);gap:var(--s4)}
.card-h h2{font-size:16px}
.card-h .hint{font-size:12px;color:var(--sx-text-muted)}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--sx-text-muted);margin:0 0 var(--s3)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s4);margin-bottom:var(--s5)}
.stat{border-radius:14px;padding:var(--s5);color:#fff;position:relative;overflow:hidden;min-height:108px}
.stat.blue{background:var(--sx-gradient-blue)}
.stat.green{background:var(--sx-gradient-green)}
.stat.dark{background:linear-gradient(135deg,#3C5474 0%,#16243A 100%)}
[data-theme="dark"] .stat.dark{border:1px solid rgba(255,255,255,0.14)}
.stat .label{font-size:12px;font-weight:600;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.stat .val{font-size:28px;font-weight:700;font-family:var(--sx-font-display);margin-top:6px;line-height:1.1}
.stat .meta{font-size:12px;opacity:.8;margin-top:6px}
.budget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:760px){.cols{grid-template-columns:1fr;gap:var(--s4)}}
@media(max-width:900px){.alloc-results{position:static}}
.budget-cell{position:relative;background:var(--sx-sat-50);border:1px solid var(--sx-border);border-radius:14px;
  padding:20px 16px 16px;text-align:center;overflow:hidden;transition:transform .14s,box-shadow .14s}
.budget-cell::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--sx-sat-300)}
.budget-cell.primary::before{background:var(--sx-gradient-blue)}
.budget-cell:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(4,12,23,0.10)}
[data-theme="dark"] .budget-cell{background:var(--sx-mid-1000)}
[data-theme="dark"] .budget-cell:hover{box-shadow:0 8px 22px rgba(0,0,0,0.4)}
.budget-cell .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sx-text-muted)}
.budget-cell .v{font-size:26px;font-weight:700;font-family:var(--sx-font-display);margin-top:6px;line-height:1.05}
.budget-cell.primary .v{color:var(--sx-blue)}
.budget-cell .cap{font-size:11px;color:var(--sx-text-muted);margin-top:5px}
.budget-foot{margin-top:var(--s4);text-align:center;font-size:12.5px;color:var(--sx-text-muted)}
.budget-foot strong{color:var(--sx-text);font-variant-numeric:tabular-nums}

/* editable list rows (dashboard) */
.linegrid{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1fr 150px 36px;gap:8px;align-items:center}
.line .lbl-in,.line .num-in{width:100%}
.line-total{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s3);
  padding-top:var(--s3);border-top:1px dashed var(--sx-border);font-weight:700}
.line-total .v{font-family:var(--sx-font-display);font-size:16px}
/* nested breakdown rows (flex so secondary lines wrap gracefully) */
.eline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:2px}
.eline>.lbl-in{flex:1 1 96px;min-width:84px}
.eline>.num-in{flex:0 0 108px}
.caret{flex:0 0 22px;border:0;background:transparent;color:var(--sx-text-muted);width:22px;height:34px;
  border-radius:6px;font-size:11px;transition:.15s;display:inline-flex;align-items:center;justify-content:center}
.caret:hover{color:var(--sx-blue);background:rgba(19,131,244,0.08)}
.caret.open{transform:rotate(90deg);color:var(--sx-blue)}
.caret.has{color:var(--sx-blue)}
.iconbtn{flex:0 0 30px}
/* rounding control: vertical ▲/▼ spinner + factor (factor only shown when active) */
.rnd{flex:0 0 auto;display:inline-flex;align-items:stretch;border:1px solid var(--sx-input-border);
  border-radius:8px;overflow:hidden;background:var(--sx-input-bg);height:36px}
.rnd.on{border-color:var(--sx-blue)}
.rdir{display:flex;flex-direction:column;width:22px}
.rbtn{flex:1;border:0;background:transparent;color:var(--sx-text-muted);font-size:8px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;transition:.12s;min-height:0}
.rbtn:first-child{border-bottom:1px solid var(--sx-input-border)}
.rbtn:hover{background:rgba(19,131,244,0.12);color:var(--sx-blue)}
.rbtn.on{background:var(--sx-blue);color:#fff}
.factor-in{width:44px;border:0;border-left:1px solid var(--sx-input-border);background:transparent;
  color:var(--sx-text);text-align:center;font-size:13px;font-variant-numeric:tabular-nums;padding:0 4px}
.factor-in:focus{outline:none;box-shadow:inset 0 0 0 2px rgba(19,131,244,0.3)}
.effbadge{flex-basis:100%;font-size:11px;color:var(--sx-blue);font-weight:600;padding-left:24px;margin-top:-2px}
.eline.nested>.effbadge{padding-left:52px}
.in.num:disabled{background:var(--sx-sat-50);color:var(--sx-text-muted);font-weight:600;cursor:not-allowed}
[data-theme="dark"] .in.num:disabled{background:var(--sx-mid-1000)}
.subwrap{width:100%;margin:2px 0 8px 26px;padding:10px 12px;border-left:2px solid var(--sx-blue);
  background:var(--sx-sat-50);border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:6px}
[data-theme="dark"] .subwrap{background:var(--sx-mid-1000)}
.subwrap .eline>.lbl-in{flex:1 1 120px}
.subwrap .effbadge{padding-left:24px}
.subwrap .addsub{align-self:flex-start;margin-top:2px}
/* drag handle */
.grip{flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;color:var(--sx-sat-400);
  cursor:grab;border-radius:5px;height:30px;width:18px;transition:.12s}
.grip:hover{color:var(--sx-blue);background:rgba(19,131,244,0.08)}
.grip:active{cursor:grabbing}
.eline.dragging{opacity:.45}
.eline.drop-before{box-shadow:0 -2px 0 0 var(--sx-blue)}
.eline.drop-after{box-shadow:0 2px 0 0 var(--sx-blue)}
/* note button + row */
.notebtn{flex:0 0 32px}
.notebtn.has{color:var(--sx-blue)}
.noterow{flex-basis:100%;padding-left:24px;margin-top:2px}
.eline.nested>.noterow{padding-left:52px}
.noterow .note-in{width:100%;font-size:12px;padding:6px 9px;background:var(--sx-sat-50);border-style:dashed}
[data-theme="dark"] .noterow .note-in{background:var(--sx-mid-1000)}
.hbtns{display:flex;gap:6px;align-items:center}
/* donut */
.donut-cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);margin-bottom:var(--s5)}
.donut-cards .card{margin-bottom:0}
.viz-section{margin:var(--s5) 0;background:var(--sx-surface);border:1px solid var(--sx-border);border-radius:16px;padding:var(--s5)}
.viz-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:var(--s3);margin-bottom:var(--s4);border-bottom:1px solid var(--sx-border)}
.viz-title{margin:0;font-size:18px;font-weight:600}
.viz-section .card{background:transparent;border:0;box-shadow:none;margin:0;padding:0}
.viz-section #sankey-card{margin-bottom:var(--s5);padding-bottom:var(--s5);border-bottom:1px solid var(--sx-border)}
.viz-section .donut-cards{margin-bottom:0}
.cols .card{margin-bottom:0}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--sx-text-muted);user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch-track{width:34px;height:20px;border-radius:999px;background:var(--sx-sat-300);position:relative;transition:.15s;flex:0 0 auto}
[data-theme="dark"] .switch-track{background:var(--sx-sat-700)}
.switch-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .switch-track{background:var(--sx-blue)}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(14px)}
.switch input:focus-visible + .switch-track{box-shadow:0 0 0 3px rgba(19,131,244,0.3)}
.donut-flex{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-flex>div:first-child{flex:0 0 auto}
.donut-svg{display:block;width:196px;height:196px;max-width:100%}
.chart-card .slice,.card .slice{transition:opacity .12s;cursor:pointer}
.slice:hover{opacity:.82}
.dn-legend{flex:1 1 190px;min-width:172px;display:flex;flex-direction:column;gap:7px}
.dn-row{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;font-size:12.5px}
.dn-row .dn-label{color:var(--sx-text)}
.dn-row .dn-val{font-variant-numeric:tabular-nums;font-weight:600}
.dn-row .dn-pct{font-variant-numeric:tabular-nums;color:var(--sx-text-muted);min-width:56px;text-align:right}
/* print */
.print-only{display:none}
@media print{
  @page{margin:14mm}
  .sidebar,.scrim,.topbar,.hamburger,.toast,.charttip{display:none!important}
  .main{display:block}
  .content{padding:0;max-width:none}
  .view{display:none!important}
  .view.active{display:block!important}
  .print-only{display:block;margin-bottom:14px;border-bottom:2px solid #040C17;padding-bottom:8px}
  .ph-title{font-family:var(--sx-font-display);font-weight:700;font-size:20px;color:#040C17}
  .ph-date{font-size:12px;color:#425A7C}
  body{background:#fff;color:#040C17}
  .card{border:1px solid #C9D2DF;break-inside:avoid;box-shadow:none;margin-bottom:14px}
  .grip,.caret,.notebtn,.iconbtn,.rnd,.btn,.tbl-actions,.hbtns,[data-add],[data-addrow]{display:none!important}
  .in,.note-in{border:none!important;background:transparent!important;padding:2px 0!important;box-shadow:none!important;color:#040C17!important}
  .in.num:disabled{color:#040C17!important}
  .noterow{padding-left:0}
  .stat,.slice,svg,.dn-row .dot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .stat{color:#fff!important}
}


/* inputs */
.in{background:var(--sx-input-bg);border:1px solid var(--sx-input-border);border-radius:8px;
  padding:8px 10px;font-size:14px;color:var(--sx-text);width:100%}
.in:focus{outline:none;border-color:var(--sx-blue);box-shadow:0 0 0 3px rgba(19,131,244,0.15)}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.iconbtn{border:0;background:transparent;color:var(--sx-text-muted);width:32px;height:32px;
  border-radius:8px;display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.iconbtn:hover{background:var(--sx-red-100);color:var(--sx-red-500)}
[data-theme="dark"] .iconbtn:hover{background:rgba(235,0,0,0.18)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s4)}
.field label{font-size:12px;font-weight:600;color:var(--sx-text-muted)}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s4)}
.month-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--s5)}
.month-nav-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sx-text-muted);margin-right:2px}
.month-nav .month-sel{max-width:180px;font-weight:600}
.month-nav .btn.ghost.sm{padding:5px 11px;font-size:15px;line-height:1}
.month-acts{display:flex;align-items:center;gap:8px}
.month-add-input{width:0;opacity:0;padding:0;margin:0;border:0;pointer-events:none}
.dwrap{min-height:0}
.stat-delta{display:inline-block;margin-top:9px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:rgba(0,0,0,0.22);color:rgba(255,255,255,0.85)}
.stat-delta.up{color:#A7F0B5}
.stat-delta.down{color:#F6AEC0}
.stat-delta.neutral,.stat-delta.flat{color:rgba(255,255,255,0.72)}
.trend-togs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.trend-tog{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;border:1px solid var(--sx-border);background:transparent;color:var(--sx-text-muted);cursor:pointer}
.trend-tog .dot{width:9px;height:9px;border-radius:50%;opacity:.35}
.trend-tog.on{color:var(--sx-text);border-color:var(--sx-input-border)}
.trend-tog.on .dot{opacity:1}
.lc-series{transition:opacity .15s}
.trend-tog{cursor:pointer}
.trend-views{display:inline-flex;gap:2px;padding:3px;background:var(--sx-sat-50);border:1px solid var(--sx-border);border-radius:10px;margin:2px 0 14px}
[data-theme="dark"] .trend-views{background:rgba(255,255,255,0.04)}
.trend-view{border:0;background:transparent;color:var(--sx-text-muted);font-size:12px;font-weight:600;padding:5px 14px;border-radius:7px;cursor:pointer}
.trend-view.on{background:var(--sx-surface);color:var(--sx-text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.trend-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px}
.trend-legi{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sx-text-muted)}
.trend-legi .dot{width:9px;height:9px;border-radius:50%}
.spark-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:4px}
.spark-tile{border:1px solid var(--sx-border);border-radius:12px;padding:12px 14px}
.spark-name{font-size:12px;font-weight:600;color:var(--sx-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:3px 0 6px}
.spark-val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.spark-chip{font-size:11px;font-weight:700}
.spark-chip.up{color:var(--sx-green)}
.spark-chip.down{color:#E0567A}
.spark-chip.flat{color:var(--sx-text-muted)}
.spark-svg{display:block;width:100%;height:42px}
.mt-range{width:100%;accent-color:var(--sx-blue);margin-top:6px;cursor:pointer}
.rate-verdict{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:2px 0 14px}
.rate-verdict.ok{color:var(--sx-green)}
.rate-verdict.warn{color:#F29E1A}
.rate-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.rate-rows{display:flex;flex-direction:column;max-width:440px}
.rate-row{display:flex;justify-content:space-between;gap:16px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--sx-border)}
.rate-row span{color:var(--sx-text-muted)}
.rate-row strong{font-variant-numeric:tabular-nums;font-weight:700}
.cloud-form .field,.cloud-cfg .field{max-width:360px}
.cloud-who{font-size:14px}
.cloud-status{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--sx-sat-100)}
[data-theme="dark"] .cloud-status{background:rgba(255,255,255,0.08)}
.cloud-status.sync-ok{color:var(--sx-green)}

/* ==================== END AUTOMATION MODULE ==================== */

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--sx-border)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}

  background:var(--sx-midnight);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;
  font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.3)}

.hamburger{display:none}
@media(max-width:880px){
  .sidebar{position:fixed;left:-260px;z-index:60;transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.4)}

}

// rounding: direction "none"|"up"|"down" by a free-hand factor (e.g. 10, 20, 50)
function applyRound(value, dir, factor){
  const f=num(factor);
  if(!dir || dir==="none" || !(f>0)) return value;
  if(dir==="up")   return Math.ceil(value/f)*f;
  if(dir==="down") return Math.floor(value/f)*f;
  return value;
}
function roundActive(x){ return x && x.round && x.round!=="none" && num(x.factor)>0; }
// effective (rounded) amount of a sub-item
function childAmount(c){ return applyRound(num(c.amount), c.round, c.factor); }
// raw amount of a line before its own rounding (sum of rounded children, or own amount)
function rawAmount(it){
  if(it && it.children && it.children.length) return it.children.reduce((s,c)=>s+childAmount(c),0);
  return num(it ? it.amount : 0);
}
// effective amount of a line: raw, then its own rounding applied
function itemAmount(it){
  return applyRound(rawAmount(it), it ? it.round : "none", it ? it.factor : 0);
}
function badgeText(it){
  const hasKids = it.children && it.children.length;
  const eff = itemAmount(it);
  if(hasKids) return `Sub-total ${money(rawAmount(it))} → rounds to ${money(eff)}`;
  return `Counts as ${money(eff)}`;
}

/* ==================== MONTHLY HISTORY — accounting is per-month (removable) ==================== */
function currentYM(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function ensureMonth(s, ym){
  if(!s.months || typeof s.months!=="object") s.months={};
  if(!s.months[ym]) s.months[ym]={income:[],deductions:[],expenses:[],savings:[],alloc:{}};
  const m=s.months[ym];
  ["income","deductions","expenses","savings"].forEach(k=>{ if(!Array.isArray(m[k])) m[k]=[]; });
  if(!m.alloc||typeof m.alloc!=="object") m.alloc={};
  return m;
}
function migrateMonths(s){
  if(!s||typeof s!=="object") return s;
  if(!s.months || typeof s.months!=="object"){            // old single-snapshot format → wrap into one month
    const ym=s.currentMonth||currentYM();
    s.months={ [ym]:{ income:s.income||[], deductions:s.deductions||[], expenses:s.expenses||[], savings:s.savings||[], alloc:(s.alloc&&typeof s.alloc==="object")?s.alloc:{} } };
    s.currentMonth=ym;
  }
  ["income","deductions","expenses","savings","alloc"].forEach(k=>{ try{ delete s[k]; }catch(e){} });
  if(!s.currentMonth || !s.months[s.currentMonth]){
    const keys=Object.keys(s.months).sort();
    s.currentMonth = keys[keys.length-1] || currentYM();
  }
  ensureMonth(s, s.currentMonth);
  return s;
}
function installMonthAccessors(s){
  ["income","deductions","expenses","savings","alloc"].forEach(k=>{
    Object.defineProperty(s, k, { configurable:true, enumerable:false,
      get(){ return ensureMonth(s, s.currentMonth)[k]; },
      set(v){ ensureMonth(s, s.currentMonth)[k]=v; } });
  });
}
function useState(obj){ migrateMonths(obj); installMonthAccessors(obj); return obj; }
function monthLabel(ym){ const p=(ym||"").split("-"); const mi=(+p[1]||1)-1; return (MONTHS[mi]||"")+" "+(p[0]||""); }
function sortedMonths(){ return Object.keys(state.months||{}).sort(); }
function nextYM(ym){ let [y,m]=ym.split("-").map(Number); m++; if(m>12){m=1;y++;} return y+"-"+String(m).padStart(2,"0"); }
function refreshMonthUIState(){ expanded.clear(); notesOpen.clear(); openExistingNotes(); }
// select the current calendar month, creating it (copied from the most recent month) if it doesn't exist
function gotoCurrentMonth(){
  const ym=currentYM(); let created=false;
  if(!state.months[ym]){
    const months=sortedMonths();
    const prior = months.filter(m=>m<=ym).pop() || months[months.length-1];
    const src = prior ? state.months[prior] : null;
    state.months[ym] = src ? JSON.parse(JSON.stringify({income:src.income||[],deductions:src.deductions||[],expenses:src.expenses||[],savings:src.savings||[],alloc:src.alloc||{}}))
                           : {income:[],deductions:[],expenses:[],savings:[],alloc:{}};
    created=true;
  }
  state.currentMonth=ym;
  return created;
}
function switchMonth(ym){ if(!state.months[ym]) return; state.currentMonth=ym; refreshMonthUIState(); persist(); rerenderCurrent(); }
function addMonthAt(ym){
  if(!/^\d{4}-\d{2}$/.test(ym)) return;
  if(state.months[ym]){ switchMonth(ym); return; }
  const src=state.months[state.currentMonth]||{};
  state.months[ym]=JSON.parse(JSON.stringify({income:src.income||[],deductions:src.deductions||[],expenses:src.expenses||[],savings:src.savings||[],alloc:src.alloc||{}}));
  state.currentMonth=ym; refreshMonthUIState(); save(); rerenderCurrent(); toast("Added "+monthLabel(ym));
}
function addMonth(){
  const months=sortedMonths(); const latest=months[months.length-1]||currentYM(); const suggest=nextYM(latest);
  const inp=document.getElementById("monthAddInput");
  if(inp && typeof inp.showPicker==="function"){
    inp.value=suggest;
    try{ inp.showPicker(); return; }catch(_){}
  }
  const ym=(prompt("New month (YYYY-MM) — starts as a copy of the current month:", suggest)||"").trim();
  if(ym && !/^\d{4}-\d{2}$/.test(ym)){ toast("Use the format YYYY-MM, e.g. 2026-07"); return; }
  if(ym) addMonthAt(ym);
}
function delMonth(){
  if(sortedMonths().length<2) return;
  if(!confirm("Delete "+monthLabel(state.currentMonth)+"? This removes that month's accounting (other months are unaffected).")) return;
  delete state.months[state.currentMonth];
  const months=sortedMonths(); state.currentMonth=months[months.length-1];
  refreshMonthUIState(); save(); rerenderCurrent();
}

/* ---------- undo / redo (session history) ---------- */
const HIST_LIMIT=120;
let undoStack=[], redoStack=[], lastCommitted=JSON.stringify(state), commitTimer=null;
function scheduleCommit(){ clearTimeout(commitTimer); commitTimer=setTimeout(commitHistory,400); }
function commitHistory(){
  clearTimeout(commitTimer); commitTimer=null;
  const snap=JSON.stringify(state);
  if(snap===lastCommitted) return;
  undoStack.push(lastCommitted);
  if(undoStack.length>HIST_LIMIT) undoStack.shift();
  lastCommitted=snap;
  redoStack=[];
  updateUndoUI();
}
function flushCommit(){ if(commitTimer) commitHistory(); }
function restore(snap){
  state=useState(JSON.parse(snap));
  persist();
  rerenderCurrent();
  updateUndoUI();
}
function doUndo(){
  flushCommit();
  if(!undoStack.length){ return; }
  redoStack.push(lastCommitted);
  lastCommitted=undoStack.pop();
  restore(lastCommitted);
  toast("Undo");
}
function doRedo(){
  flushCommit();
  if(!redoStack.length){ return; }
  undoStack.push(lastCommitted);
  lastCommitted=redoStack.pop();
  restore(lastCommitted);
  toast("Redo");
}
function updateUndoUI(){
  const u=document.getElementById("undoBtn"), r=document.getElementById("redoBtn");
  if(u) u.disabled=!undoStack.length;
  if(r) r.disabled=!redoStack.length;
}

/* ---------- formatting helpers ---------- */
function cur(){ return state.config.currency || "£"; }
function money(n){
  if(n===null||n===undefined||isNaN(n)) return "—";
  return cur()+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function pct(n){
  if(n===null||n===undefined||isNaN(n)||!isFinite(n)) return "—";
  return (n*100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
}
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
// comma-grouped, 2-decimal display for input fields (no currency symbol)
function fmtNum(n){
  if(n===""||n===null||n===undefined||isNaN(n)) return "";
  return Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
// parse a possibly comma-formatted string back to a number ("" if blank)
function parseNum(str){
  if(str===""||str==null) return "";
  const cleaned=String(str).replace(/[^0-9.\-]/g,"");
  if(cleaned===""||cleaned==="-"||cleaned===".") return "";
  const n=parseFloat(cleaned);
  return isNaN(n)?"":n;
}
// percentage <-> stored decimal (e.g. 0.032 <-> "3.20%")
function fmtPct2(dec){
  if(dec===""||dec===null||dec===undefined||isNaN(dec)) return "";
  return Number(dec*100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
}
function parsePctInput(str){
  const n=parseNum(str);
  return n===""?"":n/100;
}
function daysInMonth(monthName, year){
  const m = MONTHS.indexOf(monthName); if(m<0) return 30;
  return new Date(year, m+1, 0).getDate();
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00"); if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function spanYears(fromISO, toISO){
  const a=new Date(fromISO+"T00:00:00"), b= toISO?new Date(toISO+"T00:00:00"):new Date();
  if(isNaN(a)||isNaN(b)) return "—";
  let months=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(b.getDate()<a.getDate()) months--;
  if(months<0) months=0;
  const y=Math.floor(months/12), m=months%12;
  return (y?y+" yr ":"")+(m?m+" mo":(y?"":"0 mo"));
}

/* ---------- core monthly computation ---------- */
function compute(){
  const monthlyGross = state.income.reduce((s,i)=>s+num(i.annual),0)/12;
  const totalExpenses = state.expenses.reduce((s,e)=>s+itemAmount(e),0);
  const totalDeductions = state.deductions.reduce((s,d)=>s+num(d.amount),0);
  const totalSavings = state.savings.reduce((s,v)=>s+itemAmount(v),0);
  const netIncome = monthlyGross - totalDeductions;
  const incomeRetained = monthlyGross ? netIncome/monthlyGross : 0;
  const ym=(state.currentMonth||currentYM()).split("-"); const year=+ym[0]||nowParts().year; const mIdx=((+ym[1]||1)-1+12)%12;
  const days=new Date(year, mIdx+1, 0).getDate();
  const weeks = days/7;
  const monthBudget = netIncome - (totalExpenses + totalSavings);
  const weeklyBudget = weeks ? monthBudget/weeks : 0;
  const dailyBudget = weeklyBudget/7;
  return {monthlyGross,totalExpenses,totalDeductions,totalSavings,netIncome,
    incomeRetained,weeks,monthBudget,weeklyBudget,dailyBudget,monthName:MONTHS[mIdx]||"",year};
}

// rounding control: vertical ▲/▼ spinner (click the active arrow again to turn off) + factor when active
function roundCtl(section, parentId, id, dir, factor){
  dir = dir||"none";

          ${withRound?roundCtl(section,it.id,c.id,c.round,c.factor):""}
          <input class="in num num-in money-in" type="text" inputmode="decimal" data-section="${section}" data-parent="${it.id}" data-id="${c.id}" data-field="amount" value="${fmtNum(c.amount)}" placeholder="0.00">

      h += `<div class="subwrap">${subs||'<span class="hint">No sub-items yet.</span>'}<button class="btn ghost sm addsub" data-addchild="${section}" data-id="${it.id}">+ Add sub-item</button></div>`;
    }
    return h;
  }).join("");
}

/* ==================== TRENDS — monthly history (removable) ==================== */
function monthShort(ym){ const p=(ym||"").split("-"); return (MONTHS[(+p[1]||1)-1]||"").slice(0,3)+" "+(p[0]||"").slice(2); }
function computeMonth(ym){
  const m=state.months&&state.months[ym]; if(!m) return null;
  const gross=(m.income||[]).reduce((s,i)=>s+num(i.annual),0)/12;
  const expenses=(m.expenses||[]).reduce((s,e)=>s+itemAmount(e),0);
  const deductions=(m.deductions||[]).reduce((s,d)=>s+num(d.amount),0);
  const savings=(m.savings||[]).reduce((s,v)=>s+itemAmount(v),0);
  const net=gross-deductions, budget=net-(expenses+savings);
  return {gross,deductions,net,expenses,savings,budget,retained:gross?net/gross:0,savingsRate:net?savings/net:0};
}
// ▲/▼ chip comparing the current month to the previous one
function trendDeltaChip(cur, prev, kind, tone, prevLabel){
  if(prev==null||prevLabel==="") return "";
  const d=cur-prev, eps=kind==="pp"?0.00005:0.005;
  if(Math.abs(d)<eps) return `<span class="stat-delta flat">— no change vs ${prevLabel}</span>`;
  const up=d>0, arrow=up?"▲":"▼";
  const cls = tone==="neutral" ? "neutral" : (up?"up":"down");
  const hide=state.config.hideFigures;
  const txt = kind==="pp" ? (arrow+" "+(Math.abs(d)*100).toFixed(1)+"pp") : (arrow+(hide?"":" "+money(Math.abs(d))));
  return `<span class="stat-delta ${cls}">${txt} vs ${prevLabel}</span>`;
}
function prevMonthComp(){
  const ms=sortedMonths(), i=ms.indexOf(state.currentMonth);
  if(i<=0) return {pc:null, pL:""};
  return {pc:computeMonth(ms[i-1]), pL:monthShort(ms[i-1])};
}
const TREND_METRICS=[
  {key:"net",name:"Net income",color:"#16A085",get:c=>c.net},
  {key:"gross",name:"Gross",color:"#1383F4",get:c=>c.gross},
  {key:"deductions",name:"Deductions",color:"#5C7495",get:c=>c.deductions},
  {key:"expenses",name:"Expenses",color:"#E0567A",get:c=>c.expenses},
  {key:"savings",name:"Savings",color:"#078A04",get:c=>c.savings},
  {key:"budget",name:"Spending",color:"#F29E1A",get:c=>c.budget},
];
function trendVis(){ if(!state.config.trendLines||typeof state.config.trendLines!=="object") state.config.trendLines={net:true,gross:false,deductions:false,expenses:true,savings:true,budget:true}; return state.config.trendLines; }
// stacked area: net income split into expenses / savings / spending across months
function stackedAreaSVG(months, comps){
  const W=820,H=300,pad={l:70,r:24,t:16,b:40}, n=months.length;
  const bands=[{name:"Expenses",color:"#E0567A",get:c=>Math.max(0,c.expenses)},{name:"Savings",color:"#078A04",get:c=>Math.max(0,c.savings)},{name:"Spending",color:"#F29E1A",get:c=>Math.max(0,c.budget)}];
  const totals=comps.map(c=>bands.reduce((s,b)=>s+b.get(c),0));
  let minY=0, maxY=Math.max(1,...totals);
  const ystep=niceNum(niceNum(maxY,false)/5,true)||1; maxY=Math.ceil(maxY/ystep)*ystep;
  const sx=i=> pad.l + (n<=1?0.5:i/(n-1))*(W-pad.l-pad.r);
  const sy=y=> H-pad.b-(y-minY)/(maxY-minY)*(H-pad.t-pad.b);
  let grid="",yl="";
  for(let v=minY; v<=maxY+ystep*0.001; v+=ystep){ const y=sy(v); grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--sx-border)" stroke-width="1"/>`; yl+=`<text x="${pad.l-10}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--sx-text-muted)">${fmtAxis(v)}</text>`; }
  grid+=`<line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="var(--sx-text-muted)" stroke-width="1" opacity="0.6"/>`;
  let xl="", step=(n<=14)?1:Math.ceil(n/6);
  for(let i=0;i<n;i+=step){ const x=sx(i); xl+=`<line x1="${x}" y1="${H-pad.b}" x2="${x}" y2="${H-pad.b+5}" stroke="var(--sx-text-muted)" stroke-width="1" opacity="0.6"/><text x="${x}" y="${H-pad.b+22}" text-anchor="middle" font-size="11" fill="var(--sx-text-muted)">${monthShort(months[i])}</text>`; }
  let lower=new Array(n).fill(0), areas="", dots="";
  bands.forEach(b=>{
    const upper=comps.map((c,i)=>lower[i]+b.get(c));
    let d="M"+sx(0).toFixed(1)+","+sy(upper[0]).toFixed(1);
    for(let i=1;i<n;i++) d+=" L"+sx(i).toFixed(1)+","+sy(upper[i]).toFixed(1);
    for(let i=n-1;i>=0;i--) d+=" L"+sx(i).toFixed(1)+","+sy(lower[i]).toFixed(1);
    d+=" Z";
    areas+=`<path d="${d}" fill="${b.color}" fill-opacity="0.5" stroke="${b.color}" stroke-width="1.5"/>`;
    dots+=comps.map((c,i)=>`<circle class="pthit" cx="${sx(i).toFixed(1)}" cy="${sy(upper[i]).toFixed(1)}" r="10" fill="transparent" data-pt data-x="${b.name} · ${escapeHtml(monthLabel(months[i]))}" data-y="${money(b.get(c))}"></circle>`).join("");
    lower=upper;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${yl}${xl}${areas}${dots}</svg>`;
}
// surplus / deficit bars: spending budget left over (green) or overspent (red) per month
function surplusBarsSVG(months, comps){
  const W=820,H=300,pad={l:70,r:24,t:24,b:40}, n=months.length;
  const vals=comps.map(c=>c.budget);
  let lo=Math.min(0,...vals), hi=Math.max(0,...vals); if(lo===hi) hi=lo+1;
  const ystep=niceNum(niceNum(hi-lo,false)/5,true)||1; lo=Math.floor(lo/ystep)*ystep; hi=Math.ceil(hi/ystep)*ystep;
  const sy=y=> H-pad.b-(y-lo)/(hi-lo)*(H-pad.t-pad.b);
  const cx=i=> pad.l + (i+0.5)/n*(W-pad.l-pad.r), bw=Math.min(54,(W-pad.l-pad.r)/n*0.6);
  let grid="",yl="";
  for(let v=lo; v<=hi+ystep*0.001; v+=ystep){ const y=sy(v); grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--sx-border)" stroke-width="1"/>`; yl+=`<text x="${pad.l-10}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--sx-text-muted)">${fmtAxis(v)}</text>`; }
  grid+=`<line x1="${pad.l}" y1="${sy(0)}" x2="${W-pad.r}" y2="${sy(0)}" stroke="var(--sx-text-muted)" stroke-width="1.5"/>`;
  let bars="",xl="";
  comps.forEach((c,i)=>{ const v=c.budget, yTop=sy(Math.max(0,v)), h=Math.max(1,sy(Math.min(0,v))-yTop), color=v>=0?"#078A04":"#E0567A";
    bars+=`<rect x="${(cx(i)-bw/2).toFixed(1)}" y="${yTop.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}" data-pt data-x="${escapeHtml(monthLabel(months[i]))}" data-y="${(v>=0?'+':'−')+money(Math.abs(v))+(v>=0?' left over':' overspent')}"></rect>`;
    xl+=`<text x="${cx(i).toFixed(1)}" y="${H-pad.b+22}" text-anchor="middle" font-size="11" fill="var(--sx-text-muted)">${monthShort(months[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${yl}${bars}${xl}</svg>`;
}
// per-category mini trends (small multiples)
function trendCategories(months){
  const expNames=[], savNames=[];
  months.forEach(ym=>{ const mm=state.months[ym]||{}; (mm.expenses||[]).forEach(it=>{ if(it.label && !expNames.includes(it.label)) expNames.push(it.label); }); (mm.savings||[]).forEach(it=>{ if(it.label && !savNames.includes(it.label)) savNames.push(it.label); }); });
  const valIn=(ym,kind,name)=>{ const arr=(state.months[ym]&&state.months[ym][kind])||[]; const it=arr.find(x=>x.label===name); return it?itemAmount(it):0; };
  const cats=[]; let ci=0;
  expNames.forEach(name=> cats.push({name, good:"down", color:PALETTE[ci++%PALETTE.length], series:months.map(ym=>valIn(ym,"expenses",name))}));
  savNames.forEach(name=> cats.push({name, good:"up", color:PALETTE[ci++%PALETTE.length], series:months.map(ym=>valIn(ym,"savings",name))}));
  cats.push({name:"Spending budget", good:"up", color:PALETTE[ci++%PALETTE.length], series:months.map(ym=>computeMonth(ym).budget)});
  return cats;
}
function sparklineSVG(series, color, months){
  const W=150,H=42,pad=5, n=series.length;
  let lo=Math.min(...series), hi=Math.max(...series); if(lo===hi){lo-=1;hi+=1;}
  const sx=i=> pad + (n<=1?0.5:i/(n-1))*(W-2*pad);
  const sy=v=> H-pad - (v-lo)/(hi-lo)*(H-2*pad);
  const line=series.map((v,i)=>`${i?"L":"M"}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(" ");
  const last=n-1;
  const dots=series.map((v,i)=>`<circle class="pthit" cx="${sx(i).toFixed(1)}" cy="${sy(v).toFixed(1)}" r="8" fill="transparent" data-pt data-x="${escapeHtml(monthLabel(months[i]))}" data-y="${money(v)}"></circle>`).join("");
  return `<svg class="spark-svg" viewBox="0 0 ${W} ${H}" role="img"><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${sx(last).toFixed(1)}" cy="${sy(series[last]).toFixed(1)}" r="2.8" fill="${color}"/>${dots}</svg>`;
}
function catTileHTML(cat, months){
  const s=cat.series, latest=s[s.length-1], prev=s.length>1?s[s.length-2]:null;
  let chip="";
  if(prev!=null){
    const d=latest-prev;
    if(Math.abs(d)<0.005){ chip=`<span class="spark-chip flat">—</span>`; }
    else { const up=d>0, good=(up===(cat.good==="up")), arrow=up?"▲":"▼", p=prev?(Math.abs(d/prev)*100).toFixed(0)+"%":""; chip=`<span class="spark-chip ${good?"up":"down"}">${arrow} ${p}</span>`; }
  }
  return `<div class="spark-tile">
    <div class="spark-name">${escapeHtml(cat.name)}</div>
    <div class="spark-row"><span class="spark-val">${money(latest)}</span>${chip}</div>
    ${sparklineSVG(cat.series, cat.color, months)}
  </div>`;
}
function trendsCardHTML(){
  const collapsed=!!state.config.trendsCollapsed;
  const chev=`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="transition:transform .15s;transform:rotate(${collapsed?-90:0}deg)"><path d="M6 9l6 6 6-6"/></svg>`;
  const head=`<div class="card-h" data-trendstoggle style="cursor:pointer;user-select:none"><h3 class="section-title" style="margin:0">Trends</h3><button class="btn ghost sm" data-trendstoggle aria-expanded="${!collapsed}">${collapsed?"Show":"Hide"} ${chev}</button></div>`;
  if(collapsed) return `<div class="card" id="trends-card">${head}</div>`;
  const months=sortedMonths();
  if(months.length<2) return `<div class="card" id="trends-card">${head}<p class="hint" style="margin:6px 0 0">Add another month (from the picker at the top) to start seeing your figures trend over time.</p></div>`;
  const comps=months.map(computeMonth);
  const view=["lines","stacked","surplus","categories"].includes(state.config.trendView)?state.config.trendView:"lines";
  const switcher=`<div class="trend-views">${[["lines","Lines"],["stacked","Stacked"],["surplus","Surplus"],["categories","Categories"]].map(v=>`<button class="trend-view ${view===v[0]?"on":""}" data-trendview="${v[0]}">${v[1]}</button>`).join("")}</div>`;
  let body="";
  if(view==="lines"){
    const vis=trendVis();
    const series=TREND_METRICS.filter(mt=>vis[mt.key]).map(mt=>({ points:months.map((m,i)=>{ const cc=comps[i], y=mt.get(cc); return {x:i, y, label:monthLabel(m), tip: money(y)}; }), color:mt.color, name:mt.name, tag:mt.key }));
    const toggles=TREND_METRICS.map(mt=>`<button class="trend-tog ${vis[mt.key]?"on":""}" data-trendtog="${mt.key}"><span class="dot" style="background:${mt.color}"></span>${mt.name}</button>`).join("");
    const chart= series.length ? lineChartSVG(series,{xLabel:i=>monthShort(months[i]||""), yFmt: money, yAxis: fmtAxis, allX:true}) : `<p class="hint" style="margin:6px 0 0">Turn on a line below to draw the chart.</p>`;
    body=`<div class="trend-togs">${toggles}</div>${chart}`;
  } else if(view==="stacked"){
    const leg=[["Expenses","#E0567A"],["Savings","#078A04"],["Spending","#F29E1A"]].map(x=>`<span class="trend-legi"><span class="dot" style="background:${x[1]}"></span>${x[0]}</span>`).join("");
    body=`${stackedAreaSVG(months,comps)}<div class="trend-legend">${leg}</div>`;
  } else if(view==="surplus"){
    body=`${surplusBarsSVG(months,comps)}<div class="trend-legend"><span class="trend-legi"><span class="dot" style="background:#078A04"></span>Left over</span><span class="trend-legi"><span class="dot" style="background:#E0567A"></span>Overspent</span></div>`;
  } else {
    const cats=trendCategories(months);
    body=`<p class="hint" style="margin:0 0 12px">Each line's trend across months — latest value and change vs the previous month.</p><div class="spark-grid">${cats.map(c=>catTileHTML(c,months)).join("")}</div>`;
  }
  return `<div class="card" id="trends-card">${head}
    ${switcher}
    ${body}
  </div>`;
}
function refreshTrends(){ const c=document.getElementById("trends-card"); if(c) c.outerHTML=trendsCardHTML(); }
function patchTrends(){
  const {pc,pL}=prevMonthComp(), c=compute(), set=(id,html)=>{const e=document.getElementById(id); if(e) e.innerHTML=html;};
  set("d-net", trendDeltaChip(c.netIncome, pc?pc.net:null, "money","goodup", pL));
  set("d-ded", trendDeltaChip(c.totalDeductions, pc?pc.deductions:null, "money","neutral", pL));
  set("d-ret", trendDeltaChip(c.incomeRetained, pc?pc.retained:null, "pp","goodup", pL));
  if(!state.config.trendsCollapsed && document.getElementById("trends-card")) refreshTrends();
}

// leaf allocatable units: sub-items where they exist, else the item itself (Expenses + Savings)
function allocLeaves(section){
  const out=[];
  (state[section]||[]).forEach(it=>{
    if(it.children && it.children.length){
      it.children.forEach(c=> out.push({id:c.id, name:c.label||"(unnamed)", parent:it.label, amount:childAmount(c)}));
      // parent-level rounding buffer (e.g. children sum £385.47, line rounds up to £390) → its own assignable leaf
      const buffer = itemAmount(it) - it.children.reduce((s,c)=>s+childAmount(c),0);
      if(buffer > 0.005) out.push({id:it.id+":round", name:"rounding", parent:it.label, amount:buffer, rounding:true});
    } else {
      out.push({id:it.id, name:it.label||"(unnamed)", parent:null, amount:itemAmount(it)});
    }
  });
  return out;
}
// resolve one leaf's segments into per-bank amounts (blank amount = remainder)
function resolveAlloc(leafId, eff){
  const segs = state.alloc[leafId] || [];
  const perBank={}; let unassigned=0;
  const isBlank = s => s.amt==="" || s.amt==null || isNaN(num(s.amt));
  const fixed = segs.filter(s=>!isBlank(s));
  const blanks = segs.filter(isBlank);
  const fixedSum = fixed.reduce((a,s)=>a+num(s.amt),0);
  const remainder = Math.max(0, eff - fixedSum);
  const add=(bank,amt)=>{ if(amt<=0) return; if(bank) perBank[bank]=(perBank[bank]||0)+amt; else unassigned+=amt; };
  fixed.forEach(s=> add(s.bank, num(s.amt)) );
  if(blanks.length){ const each=remainder/blanks.length; blanks.forEach(s=> add(s.bank, each)); }
  const unalloc = blanks.length ? 0 : Math.max(0, eff - fixedSum);
  const over = Math.max(0, fixedSum - eff);
  return {perBank, unassigned, unalloc, over};
}
// the spending budget (net − expenses − savings) as an allocatable item
function spendingLeaf(){ return {id:"__spending__", name:"Spending budget", parent:null, amount:Math.max(0, compute().monthBudget)}; }
function allAllocLeaves(){ return [...allocLeaves("expenses"), ...allocLeaves("savings"), spendingLeaf()]; }
function computeAllocation(){
  const perBank={}; state.banks.forEach(b=>perBank[b.id]=0);
  let unassigned=0, unalloc=0, over=0, total=0;
  allAllocLeaves().forEach(lf=>{
    total += lf.amount;
    const r=resolveAlloc(lf.id, lf.amount);
    Object.keys(r.perBank).forEach(bk=> perBank[bk]=(perBank[bk]||0)+r.perBank[bk]);
    unassigned+=r.unassigned; unalloc+=r.unalloc; over+=r.over;
  });
  return {perBank, unassigned, unalloc, over, total};
}

function allocLeafRow(lf){

/* ==================== MONEY FLOW SANKEY (removable) ==================== */
function catBankFlows(){
  const cats={expenses:{}, savings:{}, spending:{}};
  const catTotal={};
  const run=(leaves,key)=>{ let tot=0, un=0; leaves.forEach(lf=>{ tot+=lf.amount; const r=resolveAlloc(lf.id, lf.amount); Object.keys(r.perBank).forEach(bk=> cats[key][bk]=(cats[key][bk]||0)+r.perBank[bk]); un+=r.unalloc+r.unassigned; }); if(un>0.5) cats[key].__un__=un; catTotal[key]=tot; };
  run(allocLeaves("expenses"),"expenses");
  run(allocLeaves("savings"),"savings");
  run([spendingLeaf()],"spending");
  return {cats, catTotal};
}
function accountingSankeySVG(){
  const c=compute(), G=c.monthlyGross;
  if(!(G>0)) return `<p class="hint" style="margin:8px 0">Add income to see the money flow.</p>`;
  const D=c.totalDeductions, N=c.netIncome;
  const hasBanks = state.banks.length>0;
  const {cats, catTotal} = catBankFlows();
  const E=catTotal.expenses, S=catTotal.savings, B=catTotal.spending;
  const top=30, colH=300, barW=20, gap=14, VBW=1040;
  const PX=colH/G;
  const colX=[150,380,620,860];
  const C={gross:"#1383F4",ded:"#5C7495",net:"#16A085",exp:"#E0567A",sav:"#078A04",spend:"#F29E1A",un:"#9FB0C7"};
  const N_={};
  const mk=(id,label,value,color,col)=>{ const n={id,label,value,color,col}; N_[id]=n; return n; };
  const gross=mk("gross","Gross",G,C.gross,0);
  const ded=mk("ded","Deductions",D,C.ded,1);
  const net=mk("net","Net income",N,C.net,1);
  const exp=mk("exp","Expenses",E,C.exp,2), sav=mk("sav","Savings",S,C.sav,2), spend=mk("spend","Spending",B,C.spend,2);
  const catNodes={expenses:exp,savings:sav,spending:spend};
  const stackCol=(nodes,ci)=>{ let y=top; nodes.forEach(n=>{ n.h=Math.max(1.5,n.value*PX); n.x=colX[ci]; n.y=y; y+=n.h+gap; }); };
  const col0=[gross], col1=[ded,net].filter(n=>n.value>0.5), col2=[exp,sav,spend].filter(n=>n.value>0.5);
  stackCol(col0,0); stackCol(col1,1); stackCol(col2,2);
  let col3=[];
  if(hasBanks){
    const bankNodes=state.banks.map((b,i)=>mk("bank_"+b.id, b.name, (cats.expenses[b.id]||0)+(cats.savings[b.id]||0)+(cats.spending[b.id]||0), PALETTE[i%PALETTE.length], 3)).filter(n=>n.value>0.5);
    const unTot=(cats.expenses.__un__||0)+(cats.savings.__un__||0)+(cats.spending.__un__||0);
    const unNode=unTot>1?mk("un","Unallocated",unTot,C.un,3):null;
    col3=[...bankNodes,...(unNode?[unNode]:[])];
    // barycenter ordering: place each account near the vertical centre of its main source(s) to avoid crossings
    col3.forEach(n=>{ let ws=0,w=0; ["expenses","savings","spending"].forEach(cat=>{ const v=(n.id==="un"?cats[cat].__un__:cats[cat][n.id.slice(5)])||0; if(v>0){ ws+=(catNodes[cat].y+catNodes[cat].h/2)*v; w+=v; } }); n.bary=w?ws/w:1e9; });
    col3.sort((a,b)=>a.bary-b.bary);
    stackCol(col3,3);
  }
  const cols=[col0,col1,col2,col3];
  const hide=state.config.hideFigures;
  const vstr=v=> hide ? pct(G?v/G:0) : (money(v)+"  ·  "+pct(G?v/G:0));
  const flows=[];
  const Fl=(s,t,v)=>{ if(s&&t&&v>0.5) flows.push({src:s,tgt:t,value:v}); };
  Fl(gross,ded,D); Fl(gross,net,N);
  Fl(net,exp,E); Fl(net,sav,S); Fl(net,spend,B);
  if(hasBanks) [["expenses",exp],["savings",sav],["spending",spend]].forEach(([cat,node])=>{ col3.forEach(bn=>{ const v=(bn.id==="un"?cats[cat].__un__:cats[cat][bn.id.slice(5)])||0; Fl(node,bn,v); }); });
  const bySrc={}, byTgt={};
  flows.forEach(f=>{ (bySrc[f.src.id]=bySrc[f.src.id]||[]).push(f); (byTgt[f.tgt.id]=byTgt[f.tgt.id]||[]).push(f); });
  Object.values(bySrc).forEach(list=>{ list.sort((a,b)=>a.tgt.y-b.tgt.y); let o=0; list.forEach(f=>{ f.sy0=f.src.y+o; o+=f.value*PX; f.sy1=f.src.y+o; }); });
  Object.values(byTgt).forEach(list=>{ list.sort((a,b)=>a.src.y-b.src.y); let o=0; list.forEach(f=>{ f.ty0=f.tgt.y+o; o+=f.value*PX; f.ty1=f.tgt.y+o; }); });
  // declutter labels: keep at least 26px between consecutive labels in a column
  cols.forEach(nodes=>{ let last=-1e9; nodes.forEach(n=>{ const cc=n.y+n.h/2; n.ly=Math.max(cc,last+30); last=n.ly; }); });
  const ribbons=flows.map(f=>{ const sx=f.src.x+barW, tx=f.tgt.x, mx=(sx+tx)/2;
    return `<path class="sk-rib" data-rib="${f.src.id}|${f.tgt.id}" data-pt data-x="${f.src.label} → ${escapeHtml(f.tgt.label)}" data-y="${vstr(f.value)}" fill="${f.src.color}" opacity="0.3" d="M${sx} ${f.sy0.toFixed(1)} C${mx} ${f.sy0.toFixed(1)} ${mx} ${f.ty0.toFixed(1)} ${tx} ${f.ty0.toFixed(1)} L${tx} ${f.ty1.toFixed(1)} C${mx} ${f.ty1.toFixed(1)} ${mx} ${f.sy1.toFixed(1)} ${sx} ${f.sy1.toFixed(1)} Z"></path>`; }).join("");
  const bars=Object.values(N_).filter(n=>n.h).map(n=>`<rect class="sk-bar" data-node="${n.id}" data-pt data-x="${escapeHtml(n.label)}" data-y="${vstr(n.value)}" x="${n.x}" y="${n.y}" width="${barW}" height="${n.h.toFixed(1)}" rx="3" fill="${n.color}"></rect>`).join("");
  const labels=Object.values(N_).filter(n=>n.h).map(n=>{
    if(n.col===0) return `<text class="sk-l" x="${n.x-8}" y="${(n.ly-2).toFixed(1)}" text-anchor="end">${n.label}</text><text class="sk-v" x="${n.x-8}" y="${(n.ly+12).toFixed(1)}" text-anchor="end">${vstr(n.value)}</text>`;
    return `<text class="sk-l" x="${n.x+barW+8}" y="${(n.ly-2).toFixed(1)}">${escapeHtml(n.label)}</text><text class="sk-v" x="${n.x+barW+8}" y="${(n.ly+12).toFixed(1)}">${vstr(n.value)}</text>`;
  }).join("");
  let mb=0; Object.values(N_).forEach(n=>{ if(n.h){ mb=Math.max(mb, n.y+n.h, (n.ly||0)+16); } });
  const H=Math.round(mb+20);
  return `<div style="overflow-x:auto"><svg class="sk-wrap" viewBox="0 0 ${VBW} ${H}" width="100%" style="min-width:700px;display:block">
    <style>.sk-l{font-size:12px;font-weight:600;fill:var(--sx-text)}.sk-v{font-size:11px;fill:var(--sx-text-muted)}.sk-rib{transition:opacity .12s;cursor:pointer}.sk-bar{cursor:pointer}</style>
    ${ribbons}${bars}${labels}
  </svg></div>`;
}
function refreshSankey(){ const h=document.getElementById("sankey-holder"); if(h) h.innerHTML=accountingSankeySVG(); }

function salaryComputed(){
  const rows=[...state.salary].sort((a,b)=>num(a.year)-num(b.year));
  return rows.map((r,i)=>{
    const prev = i>0 ? rows[i-1] : null;
    let nominal=null, real=null, gain=null;
    if(prev){
      const ps=num(prev.salary), s=num(r.salary), inf=num(r.inflation);
      nominal = ps? s/ps-1 : null;
      real = ps? (s/ps)/(1+inf)-1 : null;
      gain = s-(ps*(1+inf));
    }
    return {...r,nominal,real,gain};
  });
}
function salaryStats(){
  const curYear = new Date().getFullYear();
  const sorted=[...state.salary].map(r=>({year:num(r.year),salary:num(r.salary),inflation:num(r.inflation)}))
    .filter(r=>!isNaN(r.salary)&&r.salary>0).sort((a,b)=>a.year-b.year);
  if(!sorted.length) return {curSalary:0,nominal:null,real:null,lastInflation:null,refYear:null,curYear};
  const first=sorted[0];
  // reference = most recent row at or before the current system year (ignore future projections); else earliest
  let ci=-1; for(let i=0;i<sorted.length;i++){ if(sorted[i].year<=curYear) ci=i; }
  if(ci===-1) ci=0;
  const cur=sorted[ci];
  const prev = ci>0 ? sorted[ci-1] : null;
  let nominal=null, real=null;
  if(prev && prev.salary){
    nominal = cur.salary/prev.salary - 1;
    real = (cur.salary/prev.salary)/(1+cur.inflation) - 1;
  }
  return {curSalary:cur.salary, nominal, real, lastInflation:cur.inflation, refYear:cur.year, curYear};
}

function salaryChart(rows){
  const sorted=[...rows].filter(r=>!isNaN(num(r.salary))).sort((a,b)=>num(a.year)-num(b.year));
  const nominal=sorted.map(r=>({x:num(r.year),y:num(r.salary)}));
  // real salary expressed in the latest year's money: nominal × Π(1+inflation) of all later years
  const real=[]; let cum=1;
  for(let i=sorted.length-1;i>=0;i--){
    real[i]={x:num(sorted[i].year), y:num(sorted[i].salary)*cum};
    cum*=(1+num(sorted[i].inflation));
  }
  const latestYear=sorted.length?num(sorted[sorted.length-1].year):"";
  return `<div class="card chart-card">
    <div class="card-h"><h2>Salary Growth</h2><span class="hint">${nominal.length} years · real values in ${latestYear} money</span></div>
    ${lineChartSVG([

function loanComputed(){
  const rows=[...state.loan].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  return rows.map((r,i)=>{
    const prev = i>0 ? rows[i-1] : null;
    let reduced=null, pctChange=null;
    if(prev){
      const pb=num(prev.balance), b=num(r.balance);
      reduced = pb-b;
      pctChange = pb? reduced/pb : null;
    }
    return {...r,reduced,pctChange};
  });
}
// Project a payoff date from the recent net repayment trend (last ~12 months, else last 2 entries).
function loanProjection(rows){
  const T=d=>new Date(d+"T00:00:00").getTime(), DAY=86400000, MON=30.4375;
  if(rows.length<2) return {ok:false, reason:"Add at least two dated balances to project a payoff date."};
  const latest=rows[rows.length-1], latestBal=num(latest.balance), latestT=T(latest.date);
  if(latestBal<=0) return {ok:false, cleared:true, reason:"This balance is already cleared."};
  let win=rows.filter(r=>T(r.date)>=latestT-365*DAY);
  if(win.length<2) win=rows.slice(-2);
  const ws=win[0], we=win[win.length-1], days=(T(we.date)-T(ws.date))/DAY, drop=num(ws.balance)-num(we.balance);
  if(days<=0 || drop<=0) return {ok:false, reason:"The balance isn't falling over the recent period, so a payoff date can't be projected."};
  const perDay=drop/days, daysToClear=latestBal/perDay;
  return {ok:true, clearT:latestT+daysToClear*DAY, months:daysToClear/MON, monthlyRate:perDay*MON, windowMonths:Math.max(1,Math.round((T(we.date)-T(ws.date))/DAY/MON))};
}

function mortgageComputed(){
  const rows=[...state.mortgage].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  // "% to Interest" is measured from the tracking-start row (flagged with .anchor); default = first row
  let anchorIdx = rows.findIndex(r=>r.anchor); if(anchorIdx<0) anchorIdx=0;
  const start = rows.length ? num(rows[anchorIdx].balance) : 0;
  let cumInterest = 0;
  return rows.map((r,i)=>{
    const prev = i>0 ? rows[i-1] : null;
    const intr = num(r.interest);
    if(i>anchorIdx) cumInterest += intr;          // only count interest from the tracking start onward
    let reduced=null, pctChange=null, interestPct=null;
    if(prev){
      const pb=num(prev.balance), b=num(r.balance);
      reduced = pb-b;                               // net change since previous row
      pctChange = pb? reduced/pb : null;            // % of previous balance
      interestPct = pb? intr/pb : null;             // interest added as % of previous balance
    }
    let offset=null;                                // pre-anchor rows -> N/A
    if(i>=anchorIdx){
      const netReduced = start - num(r.balance);    // principal cleared since the tracking start
      offset = netReduced>0 ? cumInterest/(cumInterest+netReduced) : null;
    }
    return {...r,reduced,pctChange,interestPct,offset};
  });
}

/* ==================== MORTGAGE ANALYSIS — rate check, overpayment, split (removable) ==================== */
function mTerms(){ const t=state.config.mortgageTerms; return (t&&typeof t==="object")?t:{}; }
function mTermsReady(){ const t=mTerms(); return num(t.principal)>0 && num(t.rate)>0 && num(t.payment)>0 && /^\d{4}-\d{2}$/.test(t.start||""); }
// monthly-compounded amortization; returns months to clear, total interest, and per-month balances
function amortize(balance, ratePct, payment, extra){
  const r=(num(ratePct)||0)/100/12; let bal=num(balance), months=0, tot=0; const sched=[bal];
  const pay=num(payment)+num(extra||0);
  if(bal<=0) return {months:0,totalInterest:0,sched};
  if(r>0 && pay<=bal*r+1e-9) return {months:Infinity,totalInterest:Infinity,sched};
  while(bal>0.005 && months<1200){ const interest=bal*r; const p=Math.min(pay,bal+interest); bal=Math.max(0,bal-(p-interest)); tot+=interest; months++; sched.push(bal); }
  return {months, totalInterest:tot, sched};
}
function monthsBetweenYM(a, b){ const x=(a||"").slice(0,7).split("-"), y=(b||"").slice(0,7).split("-"); if(x.length<2||y.length<2) return 0; return (+y[0]-+x[0])*12 + (+y[1]-+x[1]); }
function addMonthsYM(baseYM, n){ let [y,m]=(baseYM||currentYM()).split("-").map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return y+"-"+String(m).padStart(2,"0"); }
// scheduled (contractual, no overpayment) balance sampled at each actual entry's date
// recent monthly payment ≈ actual recent £/month reduction (time-based) + this month's interest,
// so the projected curve starts at the SAME slope as your logged balance
function recentMonthlyPayment(rows){
  const lp=loanProjection(rows); if(!lp.ok) return null;
  const bal=rows.length?num(rows[rows.length-1].balance):0;
  return lp.monthlyRate + bal*(num(mTerms().rate)/100/12);
}
// proper amortization projection when terms exist (so it matches the scheduled curve), else fall back to the linear estimate
function mortgageProjection(rows){
  if(mTermsReady() && rows.length){
    const pay=recentMonthlyPayment(rows), bal=num(rows[rows.length-1].balance);
    if(pay>0 && bal>0){
      const a=amortize(bal, mTerms().rate, pay, 0);
      if(a.months!==Infinity && a.months>0)
        return {ok:true, source:"amort", months:a.months, clearT:new Date(addMonthsYM(currentYM(),a.months)+"-01T00:00:00").getTime(), sched:a.sched, monthlyPay:pay};
    }
  }
  return loanProjection(rows);
}
function scheduledSeries(rows){
  if(!mTermsReady()||!rows.length) return null;
  const t=mTerms(), a=amortize(t.principal,t.rate,t.payment,0); if(a.sched.length<2) return null;
  const firstOff=Math.max(0, monthsBetweenYM(t.start, rows[0].date));
  const pts=[];
  for(let off=firstOff; off<a.sched.length; off++){
    const ym=addMonthsYM(t.start, off);
    pts.push({x:new Date(ym+"-01T00:00:00").getTime(), y:a.sched[off], label:monthLabel(ym)});
  }
  return pts.length>1?pts:null;
}
function mortgageRateCheck(rows){
  if(!mTermsReady()||rows.length<2) return null;
  let ai=rows.findIndex(r=>r.anchor); if(ai<0) ai=0;            // start from the flagged (tracking-start) row
  if(rows.length-ai<2) return null;
  const r=num(mTerms().rate)/100/12; let exp=0, act=0;
  for(let i=ai+1;i<rows.length;i++){ const months=Math.max(0,monthsBetweenYM(rows[i-1].date, rows[i].date)); const avg=(num(rows[i-1].balance)+num(rows[i].balance))/2; exp+=avg*r*months; act+=num(rows[i].interest); }
  return {expected:exp, actual:act, diff: exp? (act-exp)/exp : 0, fromDate: rows[ai].date};
}
// actual principal vs interest per calendar month, from the entries
function mortgageMonthlySplit(){
  const rows=[...state.mortgage].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  if(rows.length<2) return [];
  let ai=rows.findIndex(r=>r.anchor); if(ai<0) ai=0;          // start from the flagged (tracking-start) row
  const map={}; let prev=num(rows[ai].balance);
  for(let i=ai+1;i<rows.length;i++){ const r=rows[i], ym=(r.date||"").slice(0,7); const red=prev-num(r.balance);
    if(!map[ym]) map[ym]={interest:0,principal:0}; map[ym].interest+=num(r.interest); map[ym].principal+=red; prev=num(r.balance); }
  // principal = NET balance reduction (payments minus the interest capitalised that month), so it isn't double-counted
  return Object.keys(map).sort().map(ym=>({ym, interest:map[ym].interest, principal:Math.max(0,map[ym].principal)})).filter(d=>d.interest>0.5||d.principal>0.5);
}
function piSplitSVG(data){
  const W=820,H=300,pad={l:70,r:24,t:16,b:40}, n=data.length;
  let maxY=Math.max(1,...data.map(d=>d.interest+d.principal));
  const ystep=niceNum(niceNum(maxY,false)/5,true)||1; maxY=Math.ceil(maxY/ystep)*ystep;
  const sy=y=>H-pad.b-(y/maxY)*(H-pad.t-pad.b);
  const cx=i=>pad.l+(i+0.5)/n*(W-pad.l-pad.r), bw=Math.min(50,(W-pad.l-pad.r)/n*0.62);
  let grid="",yl="";
  for(let v=0; v<=maxY+ystep*0.001; v+=ystep){ const y=sy(v); grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--sx-border)"/>`; yl+=`<text x="${pad.l-10}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--sx-text-muted)">${fmtAxis(v)}</text>`; }
  grid+=`<line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="var(--sx-text-muted)" stroke-width="1" opacity="0.6"/>`;
  let bars="",xl="";
  data.forEach((d,i)=>{ const x=cx(i)-bw/2, yI=sy(d.interest), hI=H-pad.b-yI, yP=sy(d.interest+d.principal), hP=yI-yP;
    bars+=`<rect x="${x.toFixed(1)}" y="${yI.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,hI).toFixed(1)}" fill="#E0567A" data-pt data-x="Interest · ${escapeHtml(monthLabel(d.ym))}" data-y="${money(d.interest)}"></rect>`;
    bars+=`<rect x="${x.toFixed(1)}" y="${yP.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,hP).toFixed(1)}" rx="3" fill="#078A04" data-pt data-x="Principal · ${escapeHtml(monthLabel(d.ym))}" data-y="${money(d.principal)}"></rect>`;
    xl+=`<text x="${cx(i).toFixed(1)}" y="${H-pad.b+22}" text-anchor="middle" font-size="11" fill="var(--sx-text-muted)">${monthShort(d.ym)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${yl}${bars}${xl}</svg>`;
}
function overpayImpact(latestBalance){
  const t=mTerms(), op=num(state.config.mtOverpay)||0;
  const base=amortize(latestBalance,t.rate,t.payment,0), wop=amortize(latestBalance,t.rate,t.payment,op);
  const payoffBase = base.months===Infinity?"never at this payment":monthLabel(addMonthsYM(currentYM(), base.months));
  const payoffWop  = wop.months===Infinity?"never":monthLabel(addMonthsYM(currentYM(), wop.months));
  const monthsSaved=(base.months===Infinity||wop.months===Infinity)?0:Math.max(0,base.months-wop.months);
  const intSaved=(base.months===Infinity)?0:Math.max(0,base.totalInterest-wop.totalInterest);
  const yrs=Math.floor(monthsSaved/12), mo=monthsSaved%12;
  const sooner = yrs>0?(yrs+" yr "+mo+" mo"):(monthsSaved+" month"+(monthsSaved===1?"":"s"));
  const txt = op>0
    ? `Overpaying <strong>${money(op)}/month</strong> clears your mortgage around <strong>${payoffWop}</strong> — about <strong>${sooner}</strong> sooner than the scheduled <strong>${payoffBase}</strong>, saving roughly <strong>${money(intSaved)}</strong> in interest.`
    : `Scheduled payoff (paying only ${money(t.payment)}/month) is around <strong>${payoffBase}</strong>. Drag the slider to see how overpaying speeds it up and cuts interest.`;
  return {op, txt};
}
function overpayCardHTML(latestBalance){
  const op=num(state.config.mtOverpay)||0, imp=overpayImpact(latestBalance);
  return `<div class="card" id="mt-overpay-card">
    <div class="card-h"><h2>Overpayment impact</h2><span class="hint">from your current balance at ${num(mTerms().rate).toFixed(2)}%</span></div>
    <div class="field" style="max-width:460px"><label>Extra per month: <strong id="mt-op-label">${money(op)}</strong></label>
      <input type="range" id="mtOverpay" class="mt-range" min="0" max="1000" step="25" value="${op}"></div>
    <p class="auto-info" id="mt-op-impact">${imp.txt}</p>
  </div>`;
}
function updateOverpay(latestBalance){

  const lab=document.getElementById("mt-op-label"); if(lab) lab.textContent=money(imp.op);

function mortgageExtraCards(latest, rows){
  if(!mTermsReady()) return `<div class="card"><div class="card-h"><h2>Rate tracking &amp; overpayment</h2></div><p class="hint">Add your mortgage terms in <strong>Configuration → Mortgage terms</strong> (original amount, start month, rate, monthly payment) to unlock the scheduled-vs-actual comparison, a rate check, overpayment impact, and the principal/interest split.</p></div>`;
  const rc=mortgageRateCheck(rows);
  let rcCard="";
  if(rc){
    const rate=num(mTerms().rate).toFixed(2), off=Math.max(1,Math.round(Math.abs(rc.diff)*100)), close=Math.abs(rc.diff)<0.1, lower=rc.diff<0;
    const verdict = close ? {cls:"ok", dot:"#078A04", txt:"Looks right"} : {cls:"warn", dot:"#F29E1A", txt:"These don't line up"};
    const why = close
      ? `Good sign — the interest you've logged matches what a ${rate}% rate should cost.`
      : (lower
        ? `You've logged <strong>less</strong> interest than a ${rate}% rate would charge. This usually means a <strong>gap between some entries</strong> (a month or two not recorded), or the rate/payment needs a small tweak.`
        : `You've logged <strong>more</strong> interest than a ${rate}% rate would charge. Worth checking the rate is right, whether a fee is bundled in, or if a number was mistyped.`);
    rcCard=`<div class="card"><div class="card-h"><h2>Rate check</h2><span class="hint">matching your ${rate}% rate since ${fmtDate(rc.fromDate)}</span></div>
      <div class="rate-verdict ${verdict.cls}"><span class="rate-dot" style="background:${verdict.dot}"></span>${verdict.txt}${close?"":` — about <strong>${off}% ${lower?"less":"more"}</strong> than expected`}</div>
      <div class="rate-rows">
        <div class="rate-row"><span>Interest you've logged</span><strong>${money(rc.actual)}</strong></div>
        <div class="rate-row"><span>What ${rate}% would charge</span><strong>${money(rc.expected)}</strong></div>
      </div>
      <p class="hint" style="margin:12px 0 0">${why}</p>
    </div>`;
  }
  const split=mortgageMonthlySplit();
  const splitCard = split.length? `<div class="card"><div class="card-h"><h2>Principal vs interest</h2><span class="hint">per month, from your entries</span></div>${piSplitSVG(split)}<div class="trend-legend"><span class="trend-legi"><span class="dot" style="background:#078A04"></span>Principal</span><span class="trend-legi"><span class="dot" style="background:#E0567A"></span>Interest</span></div></div>` : "";
  return rcCard + overpayCardHTML(latest) + splitCard;
}

/* ============================================================ SVG line chart (multi-series) */
function niceNum(range, round){
  if(!(range>0)) return 1;
  const exp=Math.floor(Math.log10(range)), frac=range/Math.pow(10,exp);
  let nf; if(round) nf = frac<1.5?1:frac<3?2:frac<7?5:10; else nf = frac<=1?1:frac<=2?2:frac<=5?5:10;
  return nf*Math.pow(10,exp);
}
function fmtAxis(v){
  const cur=(state.config&&state.config.currency)||"£", a=Math.abs(v);
  if(a>=1000) return cur+(v/1000).toLocaleString("en-GB",{maximumFractionDigits:1})+"k";
  return cur+Math.round(v).toLocaleString("en-GB");
}
function lineChartSVG(series, opts){
  opts = opts||{};
  // accept a single points array for back-compat
  if(series.length && series[0] && series[0].x!==undefined) series=[{points:series, color:opts.color, fill:opts.fill}];
  const W=820, H=300, pad={l:70,r:24,t:16,b:40};
  const all=series.reduce((a,s)=>a.concat(s.points),[]);
  if(!all.length) return `<div class="hint" style="padding:24px 0">No data to plot.</div>`;
  const xs=all.map(p=>p.x), ys=all.map(p=>p.y);
  let minX=Math.min(...xs), maxX=Math.max(...xs);
  let minY=Math.min(...ys), maxY=Math.max(...ys);
  if(minX===maxX){minX-=1;maxX+=1;}
  if(opts.dateAxis){ minX=new Date(new Date(minX).getFullYear()+"-01-01T00:00:00").getTime(); }
  // nice y-axis → rounded tick values (e.g. £0 / £2k / £4k …)
  if(minY===maxY){ maxY=minY+1; }
  if(minY>0) minY=0;
  const ystep=niceNum(niceNum(maxY-minY,false)/5,true)||1;
  minY=Math.floor(minY/ystep)*ystep;
  maxY=Math.ceil(maxY/ystep)*ystep;
  const sx=x=>pad.l+(x-minX)/(maxX-minX)*(W-pad.l-pad.r);
  const sy=y=>H-pad.b-(y-minY)/(maxY-minY)*(H-pad.t-pad.b);
  const multi = series.length>1;
  const axisFmt = opts.yAxis || opts.yFmt || (v=>Math.round(v));
  // gridlines / y ticks
  let grid="",yl="";
  for(let v=minY; v<=maxY+ystep*0.001; v+=ystep){
    const y=sy(v);
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--sx-border)" stroke-width="1"/>`;
    yl+=`<text x="${pad.l-10}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--sx-text-muted)">${opts.hideY ? (maxY?Math.round(v/maxY*100)+"%":"") : axisFmt(v)}</text>`;
  }
  grid+=`<line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="var(--sx-text-muted)" stroke-width="1" opacity="0.6"/>`;
  // x labels
  let xl="";
  if(opts.dateAxis){
    // ticks at true year boundaries (Jan 1) so points sit correctly between them
    const y0=new Date(minX).getFullYear(), y1=new Date(maxX).getFullYear(), span=y1-y0;
    const step = span<=12?1 : span<=24?2 : Math.ceil(span/10);
    const mk=(t,lab)=>`<text x="${sx(t)}" y="${H-pad.b+22}" text-anchor="middle" font-size="11" fill="var(--sx-text-muted)">${lab}</text>`;
    for(let y=y0;y<=y1;y++){
      if((y-y0)%step!==0) continue;
      const t=new Date(y+"-01-01T00:00:00").getTime();
      if(t<minX||t>maxX) continue;
      xl+=mk(t, String(opts.xLabel?opts.xLabel(t):y));
    }
    if(!xl) xl=mk(minX,String(opts.xLabel?opts.xLabel(minX):y0))+mk(maxX,String(opts.xLabel?opts.xLabel(maxX):y1));
  } else {
    const base=series.reduce((a,s)=>s.points.length>a.points.length?s:a,series[0]);
    const n=base.points.length, step=(opts.allX && n<=14)?1:Math.max(1,Math.ceil(n/6));
    for(let i=0;i<n;i+=step){
      const p=base.points[i], x=sx(p.x);
      xl+=`<line x1="${x}" y1="${H-pad.b}" x2="${x}" y2="${H-pad.b+5}" stroke="var(--sx-text-muted)" stroke-width="1" opacity="0.6"/>`;
      xl+=`<text x="${x}" y="${H-pad.b+22}" text-anchor="middle" font-size="11" fill="var(--sx-text-muted)">${opts.xLabel?opts.xLabel(p.x):p.x}</text>`;
    }
  }
  let defs="", groups="";
  series.forEach((s,si)=>{
    const color=s.color||"#1383F4", pts=s.points; if(!pts.length) return;
    const line=pts.map((p,i)=>`${i?"L":"M"}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(" ");
    let g="";
    if(s.fill){
      const gid="g"+si+Math.random().toString(36).slice(2,6);
      defs+=`<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient>`;
      const area=`M${sx(pts[0].x).toFixed(1)},${sy(minY).toFixed(1)} `+pts.map(p=>`L${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(" ")+` L${sx(pts[pts.length-1].x).toFixed(1)},${sy(minY).toFixed(1)} Z`;
      g+=`<path d="${area}" fill="url(#${gid})"/>`;
    }
    g+=`<path class="lc-line" d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" ${s.dash?'stroke-dasharray="6 5"':''}/>`;
    g+=s.noDots?"":pts.map(p=>{
      const cx=sx(p.x).toFixed(1), cy=sy(p.y).toFixed(1);
      const xlab=escapeHtml(String(p.label!=null?p.label:(opts.xLabel?opts.xLabel(p.x):p.x)));
      const yval=escapeHtml(String(p.tip!=null?p.tip:(opts.yFmt?opts.yFmt(p.y):p.y)));
      const tag=multi&&s.name?escapeHtml(s.name)+" · ":"";
      return `<circle class="pt" cx="${cx}" cy="${cy}" r="3.5" fill="${color}"/>`
        +`<circle class="pthit" cx="${cx}" cy="${cy}" r="11" fill="transparent" data-pt data-x="${tag}${xlab}" data-y="${yval}"><title>${tag}${xlab}: ${yval}</title></circle>`;
    }).join("");
    groups+=`<g class="lc-series" data-series="${escapeHtml(s.tag||'')}">${g}</g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><defs>${defs}</defs>${grid}${yl}${xl}${groups}</svg>`;
}

/* ============================================================ donut chart */
const PALETTE=["#1383F4","#F29E1A","#9B59B6","#E0567A","#42A5F5","#0D1775","#5C7495","#7B90AE","#9FB0C7","#B3C0D3"];
const DED_PALETTE=["#1383F4","#F29E1A","#16A085","#9B59B6","#E0567A","#5C7495","#0D1775"];
function donutSVG(slices, centerLabel, centerValue){
  const total=slices.reduce((s,x)=>s+x.value,0);
  if(!(total>0)) return `<div class="hint" style="padding:24px 0">Nothing to chart yet.</div>`;
  const cx=110,cy=110,r=78,sw=30,C=2*Math.PI*r;
  let acc=0, arcs="";
  slices.forEach(s=>{
    const f=s.value/total;
    const seg=Math.max(0,f*C-1.2); // tiny gap between segments
    arcs+=`<circle class="slice" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}"
      stroke-dasharray="${seg.toFixed(2)} ${(C-seg).toFixed(2)}" stroke-dashoffset="${(-acc*C).toFixed(2)}"
      data-pt data-x="${escapeHtml(s.label)}" data-y="${escapeHtml(money(s.value)+' · '+(f*100).toFixed(1)+'%')}"><title>${escapeHtml(s.label)}: ${escapeHtml(money(s.value))}</title></circle>`;
    acc+=f;
  });
  return `<svg viewBox="0 0 220 220" width="220" height="220" class="donut-svg" role="img">
    <g transform="rotate(-90 ${cx} ${cy})">${arcs}</g>
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="12" fill="var(--sx-text-muted)">${escapeHtml(centerLabel)}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="18" font-weight="700" fill="var(--sx-text)" style="font-family:var(--sx-font-display)">${escapeHtml(centerValue)}</text>
  </svg>`;
}
function spendSlices(){
  const slices=[];
  state.expenses.forEach((e,i)=>{ const v=itemAmount(e); if(v>0) slices.push({label:e.label||"Expense",value:v,color:PALETTE[i%PALETTE.length]}); });
  const sav=state.savings.reduce((s,v)=>s+itemAmount(v),0);
  if(sav>0) slices.push({label:"Savings",value:sav,color:"#078A04"});
  const c=compute();
  if(c.monthBudget>0) slices.push({label:"Spending budget",value:c.monthBudget,color:"#B3C0D3"});
  return slices;
}
function incomeSlices(){
  const slices=[];
  state.deductions.forEach((d,i)=>{ const v=num(d.amount); if(v>0) slices.push({label:d.label||"Deduction",value:v,color:DED_PALETTE[i%DED_PALETTE.length]}); });
  if(state.config.includeNet){ const c=compute(); if(c.netIncome>0) slices.push({label:"Net income (take-home)",value:c.netIncome,color:"#078A04"}); }
  return slices;
}
function donutCardInner(slices, centerLabel, centerValue, note){
  const total=slices.reduce((s,x)=>s+x.value,0);
  const hide=state.config.hideFigures;
  const legend=slices.map(s=>`<div class="dn-row">
      <span class="dot" style="background:${s.color}"></span>
      <span class="dn-label">${escapeHtml(s.label)}</span>
      ${hide?"":`<span class="dn-val">${money(s.value)}</span>`}
      <span class="dn-pct">${total?(s.value/total*100).toFixed(2):"0.00"}%</span>
    </div>`).join("");
  return `<div class="donut-flex"><div>${donutSVG(slices,centerLabel,hide?"":centerValue)}</div><div class="dn-legend">${legend}${note||""}</div></div>`;
}
function renderDonuts(){
  const c=compute();
  const inc=document.getElementById("donut-income");
  if(inc){
    const incl=state.config.includeNet;
    inc.innerHTML=donutCardInner(incomeSlices(), incl?"Gross income":"Total deductions", money(incl?c.monthlyGross:c.totalDeductions));
    const title=document.getElementById("inc-title");
    if(title) title.textContent = incl?"Gross Income Breakdown":"Deductions Breakdown";

    sp.innerHTML=donutCardInner(spendSlices(),"Net income",money(c.netIncome),note);
  }
}

// reformat money inputs, then refresh chart-backed views once an edit is committed
let sectionEdited=false, viewRefreshTimer=null;
function cancelViewRefresh(){ clearTimeout(viewRefreshTimer); sectionEdited=false; }
document.querySelector(".content").addEventListener("focusout", e=>{
  const t=e.target;
  if(!t.classList || t.disabled) return;
  if(t.classList.contains("money-in")){
    const n=parseNum(t.value);
    t.value = (n===""?"":fmtNum(n));
  } else if(t.classList.contains("pct-in")){
    const d=parsePctInput(t.value);
    t.value = (d===""?"":fmtPct2(d));
  }
  // once an edit in a tracker view is committed (leaving the field), re-render so the
  // chart, stat cards, projection and row order all update — restoring focus if tabbing
  if(t.dataset.section && sectionEdited){
    const view=document.querySelector(".view.active").dataset.view;
    if(view==="salary"||view==="mortgage"||view==="loan"||view==="living"){
      sectionEdited=false;
      const nx=e.relatedTarget;
      clearTimeout(viewRefreshTimer);
      viewRefreshTimer=setTimeout(()=>{
        if(RENDER[view]) RENDER[view]();
        if(nx && nx.dataset && nx.dataset.section){
          const el=document.querySelector(`[data-section="${nx.dataset.section}"][data-id="${nx.dataset.id}"][data-field="${nx.dataset.field}"]`);
          if(el){ el.focus(); if((el.classList.contains("money-in")||el.classList.contains("pct-in"))&&el.select) el.select(); }
        }
      },0);
    }
  }
});

let recalcTimer=null;
function scheduleRecalc(view){
  clearTimeout(recalcTimer);
  recalcTimer=setTimeout(()=>{
    // only re-render computed cells without stealing focus: simplest safe approach -> update calc cells
    updateComputedCells(view);
  },350);
}
function updateComputedCells(view){
  if(view==="salary"){
    const rows=salaryComputed();
    rows.forEach(r=>{
      const tr=document.querySelector(`#view-salary tr[data-id="${r.id}"]`); if(!tr)return;
      const cells=tr.querySelectorAll("td");
      setCalc(cells[3], r.nominal==null?"N/A":pct(r.nominal), r.nominal);
      setCalc(cells[4], r.real==null?"N/A":pct(r.real), r.real);
      setCalc(cells[5], r.gain==null?"N/A":money(r.gain), r.gain);
    });
    const ss=salaryStats(), set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
    set("ss-current", money(ss.curSalary));
    set("ss-nom", ss.nominal==null?"—":pct(ss.nominal));
    set("ss-real", ss.real==null?"\u00A0":"Real "+pct(ss.real));
    set("ss-infl", ss.lastInflation==null?"—":pct(ss.lastInflation));
  } else if(view==="loan"){
    const rows=loanComputed();
    rows.forEach(r=>{
      const tr=document.querySelector(`#view-loan tr[data-id="${r.id}"]`); if(!tr)return;
      const cells=tr.querySelectorAll("td");
      setCalc(cells[2], r.reduced==null?"N/A":money(r.reduced), r.reduced);
      setCalc(cells[3], r.pctChange==null?"N/A":pct(r.pctChange), r.pctChange);
    });
  } else if(view==="mortgage"){/* MORTGAGE */
    const rows=mortgageComputed();
    rows.forEach(r=>{
      const tr=document.querySelector(`#view-mortgage tr[data-id="${r.id}"]`); if(!tr)return;
      const cells=tr.querySelectorAll("td");
      setCalc(cells[3], r.reduced==null?"N/A":money(r.reduced), r.reduced);
      setCalc(cells[4], r.pctChange==null?"N/A":pct(r.pctChange), r.pctChange);
      const c5=cells[5]; c5.textContent=r.interestPct==null?"N/A":pct(r.interestPct); c5.classList.remove("pos","neg","calc"); if(r.interestPct==null) c5.classList.add("calc");
      const c6=cells[6]; c6.textContent=r.offset==null?"N/A":pct(r.offset); c6.classList.remove("pos","neg","calc"); c6.classList.add(r.offset==null?"calc":(r.offset<0.5?"pos":"neg"));
    });
  }
}
function setCalc(td,text,val){
  if(!td)return; td.textContent=text;
  td.classList.remove("pos","neg","calc");
  td.classList.add(val==null?"calc":(val>=0?"pos":"neg"));
}
