// ---- drag-to-reorder (dashboard lists & sub-items) ----
let dragCtx=null;
function listFor(ctx){
  if(ctx.parent){ const p=state[ctx.section].find(x=>x.id===ctx.parent); return p?p.children:null; }
  return state[ctx.section];
}
function clearDropMarks(){ document.querySelectorAll(".drop-before,.drop-after").forEach(n=>n.classList.remove("drop-before","drop-after")); }
document.querySelector(".content").addEventListener("mousedown", e=>{
  const g=e.target.closest(".grip"); if(!g) return;
  const row=g.closest(".eline"); if(row) row.setAttribute("draggable","true");
});
document.querySelector(".content").addEventListener("mouseup", ()=>{
  document.querySelectorAll('.eline[draggable="true"]').forEach(r=>r.removeAttribute("draggable"));
});
document.querySelector(".content").addEventListener("dragstart", e=>{
  const row=e.target.closest('.eline[draggable="true"]'); if(!row){ return; }
  dragCtx={section:row.dataset.section, id:row.dataset.id, parent:row.dataset.parent||null, level:row.dataset.level};
  row.classList.add("dragging");
  try{ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",row.dataset.id); }catch(_){}
});
document.querySelector(".content").addEventListener("dragover", e=>{
  if(!dragCtx) return;
  const row=e.target.closest(".eline"); if(!row) return;
  // must be same section, same level, same parent
  if(row.dataset.section!==dragCtx.section || (row.dataset.parent||null)!==dragCtx.parent || row.dataset.id===dragCtx.id){ return; }
  e.preventDefault();
  const r=row.getBoundingClientRect(); const after=e.clientY > r.top+r.height/2;
  clearDropMarks(); row.classList.add(after?"drop-after":"drop-before");
});
document.querySelector(".content").addEventListener("drop", e=>{
  if(!dragCtx) return;
  const row=e.target.closest(".eline");
  clearDropMarks();
  if(row && row.dataset.section===dragCtx.section && (row.dataset.parent||null)===dragCtx.parent && row.dataset.id!==dragCtx.id){
    e.preventDefault();
    const list=listFor(dragCtx); if(list){
      const r=row.getBoundingClientRect(); const after=e.clientY > r.top+r.height/2;
      const fi=list.findIndex(x=>x.id===dragCtx.id); const [moved]=list.splice(fi,1);
      let ti=list.findIndex(x=>x.id===row.dataset.id); if(after) ti+=1;
      list.splice(ti,0,moved); save();
    }
  }
  dragCtx=null; renderAccounting();
});
document.querySelector(".content").addEventListener("dragend", ()=>{
  clearDropMarks();
  document.querySelectorAll('.eline[draggable="true"],.eline.dragging').forEach(r=>{r.removeAttribute("draggable");r.classList.remove("dragging");});
  dragCtx=null;
});

async function cloudAdopt(){

  cloudSetStatus("saving");
  try{
    const { data, error } = await sb.from("planner_states").select("data").eq("user_id", sbUser.id).maybeSingle();

function applyCloudState(obj){
  state=useState(obj);
  if(!Array.isArray(state.mortgage)) state.mortgage=[];
  if(!Array.isArray(state.banks)) state.banks=[];
  const created=gotoCurrentMonth();/* MONTH: land on current month */
  openExistingNotes(); persist(); rerenderCurrent();
  if(created && sbUser) scheduleCloudPush();
}
async function cloudSignIn(email,password){
  const c=cloudInitClient(); if(!c) return {error:"Cloud not configured"};
  const { data, error } = await c.auth.signInWithPassword({ email, password });
  if(error) return {error:error.message};
  sbUser=data.user; await cloudAdopt(); cloudRenderAll(); return {ok:true};
}
async function cloudSignUp(email,password){
  const c=cloudInitClient(); if(!c) return {error:"Cloud not configured"};
  const { data, error } = await c.auth.signUp({ email, password });
  if(error) return {error:error.message};
  if(!data.session) return {ok:true, needConfirm:true};
  sbUser=data.user; await cloudAdopt(); cloudRenderAll(); return {ok:true};
}
async function cloudSignOut(){ try{ if(sb) await sb.auth.signOut(); }catch(e){} sbUser=null; cloudDirty=false; cloudRenderAll(); }
async function cloudInit(){
  if(!cloudInitClient()) return;
  try{ const { data } = await sb.auth.getSession(); if(data && data.session){ sbUser=data.session.user; await cloudAdopt(); } }catch(e){}
  cloudRenderAll();
}
// best-effort flush of any pending change when the tab is hidden/closed
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && cloudDirty && sb && sbUser){ clearTimeout(cloudPushTimer); cloudPush(); } });
function cloudSetStatus(kind,msg){
  cloudStatusKind=kind; cloudStatusMsg=msg||"";
  const map={ saving:["Syncing…","sync-busy"], synced:["Synced","sync-ok"], error:["Sync error"+(msg?" · "+msg:""),"sync-err"] };
  const [txt,cls]=map[kind]||["",""];
  document.querySelectorAll(".cloud-status").forEach(e=>{ e.textContent=txt; e.className="cloud-status "+cls; });
  const b=document.getElementById("cloud-badge"); if(b) b.className="cloud-av-badge "+(cls||"sync-ok");
}
function cloudMsg(m){ const e=document.getElementById("cloud-msg"); if(e) e.textContent=m||""; }
function cloudVal(id){ const e=document.getElementById(id); return e?e.value.trim():""; }
function cloudSyncCardHTML(){
  let body;
  if(!cloudLibReady()){
    body=`<p class="hint">The cloud library couldn't load (you may be offline). Your data is still saved locally — reconnect and reload to enable sync.</p>`;
  } else if(sbUser){
    body=`<p class="cloud-who">Signed in as <strong>${escapeHtml(sbUser.email||"account")}</strong> <span class="cloud-status sync-ok" id="cloud-status">Synced</span></p>
      <p class="hint">Manage sign-in and sync from the account button in the top-right.</p>`;
  } else {
    body=`<p class="hint">Not signed in. Use the <strong>Sign in</strong> button in the top-right to back up &amp; sync your data across devices.</p>`;
  }
  return `<div class="card" id="cloud-card">
    <div class="card-h"><h2>Cloud Sync</h2><span class="hint">Back up &amp; sync across devices</span></div>
    ${body}
  </div>`;
}
function renderCloudTopbar(){
  const el=document.getElementById("cloud-topbar"); if(!el) return;
  if(!cloudLibReady()){ el.innerHTML=""; return; }
  if(sbUser){
    const email=sbUser.email||"account", initial=(email.trim()[0]||"?").toUpperCase();
    el.innerHTML=`<button class="cloud-avatar" id="cloudAvatarBtn" title="${escapeHtml(email)}" aria-label="Account and sync"><span>${escapeHtml(initial)}</span><span class="cloud-av-badge sync-ok" id="cloud-badge"></span></button>`;
  } else {
    el.innerHTML=`<button class="btn ghost sm" id="cloudLoginBtn">Sign in</button>`;
  }
  cloudReapplyStatus();
}
function cloudReapplyStatus(){ if(cloudStatusKind) cloudSetStatus(cloudStatusKind, cloudStatusMsg); else if(sbUser) cloudSetStatus("synced"); }
function cloudRenderAll(){ renderCloudTopbar(); renderConfig(); cloudReapplyStatus(); }
// ---- account / sign-in popover ----
let cloudPopEl=null;
function cloudPopHTML(mode){
  if(mode==="account"){
    return `<div class="cloud-pop-in">
      <div class="cloud-pop-email">${escapeHtml(sbUser.email||"account")}</div>
      <div><span class="cloud-status sync-ok" id="cloud-status">Synced</span></div>
      <div class="cloud-pop-row"><button class="btn sm" id="cloudSyncNow">Sync now</button><button class="btn sm" id="cloudSignOut">Sign out</button></div>
    </div>`;
  }
  return `<div class="cloud-pop-in">
    <div class="cloud-pop-title">Sign in to sync</div>
    <input class="in" id="cloud-email" type="email" placeholder="Email" autocomplete="username">
    <input class="in" id="cloud-pass" type="password" placeholder="Password" autocomplete="current-password">
    <div class="cloud-pop-row"><button class="btn primary sm" id="cloudSignIn">Sign in</button><button class="btn sm" id="cloudSignUp">Create account</button></div>
    <p class="cloud-msg" id="cloud-msg"></p>
  </div>`;
}
function toggleCloudPop(mode){
  if(!cloudPopEl){ cloudPopEl=document.createElement("div"); cloudPopEl.id="cloud-pop"; cloudPopEl.className="cloud-pop"; document.body.appendChild(cloudPopEl); }
  if(cloudPopEl.classList.contains("show") && cloudPopEl.dataset.mode===mode){ closeCloudPop(); return; }
  cloudPopEl.dataset.mode=mode;
  cloudPopEl.innerHTML=cloudPopHTML(mode);
  const anchor=document.getElementById(mode==="account"?"cloudAvatarBtn":"cloudLoginBtn");
  if(anchor){ const r=anchor.getBoundingClientRect(); cloudPopEl.style.top=(r.bottom+8)+"px"; cloudPopEl.style.right=Math.max(8,(window.innerWidth-r.right))+"px"; }
  cloudPopEl.classList.add("show");
  cloudReapplyStatus();
  cloudPopEl.querySelectorAll("input").forEach(inp=> inp.addEventListener("keydown", ev=>{ if(ev.key==="Enter"){ const b=document.getElementById("cloudSignIn"); if(b) b.click(); } }));
  const em=document.getElementById("cloud-email"); if(em) em.focus();
}
function closeCloudPop(){ if(cloudPopEl) cloudPopEl.classList.remove("show"); }
/* ==================== END CLOUD SYNC ==================== */

// first paint
openExistingNotes();
renderAccounting();
updateUndoUI();
renderCloudTopbar();/* CLOUD */
cloudInit();/* CLOUD */
</script>
